[package]
name = "orbs_protocol"
version = "0.1.0"
description = "Orbs.meme isolated SPL prize escrow protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "orbs_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
local-testing = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["associated_token", "token"] }
